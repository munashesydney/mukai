name: Checks
on:
  push:
  pull_request:

permissions:
  contents: read

env:
  # Embeddings use the bundled CPU backend; avoid optional CUDA downloads from NuGet.
  ONNXRUNTIME_NODE_INSTALL: skip

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build

  desktop-helpers:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build:computer-use
      - run: npx vitest run src/server/services/computerUseService.test.ts src/server/tools/computer_use/computer_use.test.ts src/server/computer/computer_use/nativeBackend.test.ts src/server/services/processService.test.ts
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb python3 libx11-6 libxtst6 libxrandr2
      - name: Install and configure Electron sandbox
        if: runner.os == 'Linux'
        run: |
          node -e "require('electron')"
          sudo chown root:root node_modules/electron/dist/chrome-sandbox
          sudo chmod 4755 node_modules/electron/dist/chrome-sandbox
      - name: Test native X11 desktop input
        if: runner.os == 'Linux'
        run: |
          for attempt in 1 2 3 4 5; do
            env -u WAYLAND_DISPLAY XDG_SESSION_TYPE=x11 xvfb-run -a dbus-run-session -- npm run test:computer-use -- --interactive
          done
      - uses: actions/upload-artifact@v4
        if: failure() && runner.os == 'Linux'
        with:
          name: linux-desktop-smoke
          path: artifacts/computer_use/*.png
